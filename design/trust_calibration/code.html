<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Top Navigation suppressed for Transactional Screen -->
<main class="w-full max-w-[720px] bg-surface-container-lowest border border-outline-variant rounded-xl p-6 md:p-12 shadow-sm transition-all duration-300">
<div class="mb-8 flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
<span>Trust Calibration</span>
</div>
<section class="mb-12">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-6">Evaluate the following AI statement:</h2>
<div class="bg-tertiary-container/10 border-l-4 border-primary p-6 rounded-r-lg mb-8">
<p class="font-body-md text-body-md text-on-surface italic">
                    "The Gulf of Execution refers to the difficulty of evaluating the system state after an action."
                </p>
</div>
</section>
<section class="mb-12">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-6 uppercase tracking-wider">How confident are you that this statement is correct?</h3>
<div class="flex flex-col md:flex-row items-center justify-between gap-4">
<span class="font-body-sm text-body-sm text-on-surface-variant w-full md:w-auto text-center md:text-left">Not at all confident</span>
<div class="flex items-center gap-2 md:gap-4 w-full md:w-auto justify-between">
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="1"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">1</div>
</label>
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="2"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">2</div>
</label>
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="3"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">3</div>
</label>
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="4"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">4</div>
</label>
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="5"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">5</div>
</label>
<label class="cursor-pointer group flex flex-col items-center">
<input class="peer sr-only" name="confidence" type="radio" value="6"/>
<div class="w-10 h-10 rounded-full border-2 border-outline-variant flex items-center justify-center font-label-md text-label-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary peer-checked:text-on-primary hover:border-primary transition-colors">6</div>
</label>
