<!DOCTYPE html>

<html class="h-full" lang="en"><head>

                            "primary-container": "#0f4c81",

                            "secondary-fixed-dim": "#afcbd8",
                            "surface-dim": "#dadadc",
                            "on-surface": "#1a1c1e",
                            "tertiary-fixed-dim": "#bac9d3",
                            "surface": "#f9f9fc",

                            "surface-container-highest": "#e2e2e5",
                            "on-primary-container": "#8ebdf9",
                            "inverse-on-surface": "#f0f0f3",
                            "surface-container-low": "#f3f3f6",
                            "on-tertiary": "#ffffff",
                            "on-primary-fixed": "#001c37",

                            "surface-bright": "#f9f9fc",
                            "surface-container": "#eeeef0",
                            "secondary": "#48626e",
                            "on-background": "#1a1c1e",
                            "primary": "#00355f",
                            "tertiary-fixed": "#d6e5ef",

                            "surface-container-lowest": "#ffffff",
                            "on-secondary-fixed": "#021f29",

                            "background": "#f9f9fc",

            },

<style>
        /* Base styles focusing on Academic Minimalism */
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        
        .radio-custom:checked + div {
            border-color: theme('colors.primary');
            background-color: theme('colors.surface-container-low');
        }
        .radio-custom:checked + div .radio-icon {
            color: theme('colors.primary');
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle interactive border transition */
        .option-card {
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .option-card:hover {
            border-color: theme('colors.outline');
        }
    </style>
</head>
<body class="h-full flex flex-col font-body-sm bg-background">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-gutter h-16 shrink-0 sticky top-0 z-50">
<div class="flex items-center gap-4">
<span class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-semibold text-primary">Playing Socrates</span>
</div>
<div class="flex items-center gap-gutter">
<span class="font-label-md text-label-md text-on-surface-variant hidden md:block">Participant ID: #8291</span>
<div class="flex gap-4">
<button aria-label="Settings" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button aria-label="Help" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
</div>
</div>
</header>
<!-- Main Content Area -->
<!-- Nav suppressed as this is a linear/transactional flow (Post-test) -->
<main class="flex-grow flex flex-col items-center py-section-gap px-margin-mobile md:px-margin-desktop overflow-y-auto">
<div class="w-full max-w-[720px] flex flex-col gap-unit">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Post-Test: The Ethics of AI</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Question 1 of 10</span>
</div>
<div class="h-1 bg-surface-container-high rounded-full w-full overflow-hidden">
<div class="h-full bg-primary w-[10%] rounded-full transition-all duration-300"></div>
</div>
</div>
<!-- Question Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 md:p-8 mb-8 shadow-sm">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-6">
                    Which of the following is a primary concern in the deployment of autonomous decision-making systems in critical infrastructure?
                </h1>
<!-- Options Grid -->
<div class="flex flex-col gap-4 mt-8">
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="q1" type="radio" value="A"/>
<div class="option-card bg-surface border border-outline-variant rounded-xl p-4 flex items-center gap-4">
<span class="material-symbols-outlined radio-icon text-outline-variant text-2xl transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface">Bias mitigation</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="q1" type="radio" value="B"/>
<div class="option-card bg-surface border border-outline-variant rounded-xl p-4 flex items-center gap-4">
<span class="material-symbols-outlined radio-icon text-outline-variant text-2xl transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface">User interface color</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="q1" type="radio" value="C"/>
<div class="option-card bg-surface border border-outline-variant rounded-xl p-4 flex items-center gap-4">
<span class="material-symbols-outlined radio-icon text-outline-variant text-2xl transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface">Font selection</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only peer" name="q1" type="radio" value="D"/>
<div class="option-card bg-surface border border-outline-variant rounded-xl p-4 flex items-center gap-4">
<span class="material-symbols-outlined radio-icon text-outline-variant text-2xl transition-colors" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-on-surface">Keyboard shortcuts</span>
</div>
</label>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center mt-4">
<button class="font-label-md text-label-md text-secondary border border-secondary rounded hover:bg-surface-container transition-colors px-6 py-2 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled="">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                    Previous
                </button>
<button class="font-label-md text-label-md bg-primary-container text-on-primary rounded hover:bg-primary transition-colors px-6 py-2 flex items-center gap-2">
                    Next
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for radio buttons to update icons on selection
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all icons
                document.querySelectorAll('.radio-icon').forEach(icon => {
                    icon.textContent = 'radio_button_unchecked';
                    icon.style.fontVariationSettings = "'FILL' 0";
                });
                // Set checked icon
                if (this.checked) {
                    const activeIcon = this.nextElementSibling.querySelector('.radio-icon');
                    activeIcon.textContent = 'radio_button_checked';
                    activeIcon.style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
    </script>
</body></html>
